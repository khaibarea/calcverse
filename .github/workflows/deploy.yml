name: Deploy to Namecheap Hosting

# Triggers the deployment every time code is pushed to the main branch
on:
  push:
    branches:
      - main
  # Allows manual deployment from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the latest code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Upload files to Namecheap hosting via FTP
      # Uses your Namecheap "FTP Username" and "FTP Password"
      # from cPanel > Files > FTP Accounts
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          protocol: ftps
          port: 21
          # ONE-TIME cleanup: wipe server files (.git/.github) not in repo, then set back to false
          dangerous-clean-slate: true
          # Exclude git/github files from deployment
          exclude: |
            .git/**
            .github/**
            .gitignore
            .ftp-deploy-sync-state.json
